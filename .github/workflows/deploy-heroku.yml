name: Deploy Heroku
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-testing
  cancel-in-progress: false
jobs:
  test:
    uses: ./.github/workflows/test.yml
  deploy-heroku:
    if: github.ref == 'refs/heads/main'
    needs: [test]
    runs-on: ubuntu-latest
    environment: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Heroku CLI
        run: npm install --global heroku
      - name: Prepare minimal source snapshot
        run: |
          set -eu
          snapshot="$RUNNER_TEMP/heroku-source"
          mkdir -p "$snapshot"
          git archive "$GITHUB_SHA" Procfile requirements.txt .python-version pyproject.toml services shared scripts deploy/heroku-entrypoint.sh | tar -x -C "$snapshot"
          cd "$snapshot"
          git init -b main
          git config user.name 'GitHub Actions'
          git config user.email 'actions@users.noreply.github.com'
          git add .
          git commit -m "Deploy source for $GITHUB_SHA"
      - name: Deploy services using Heroku buildpacks
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
          AUTH_APP: ${{ vars.HEROKU_AUTH_APP }}
          MCP_APP: ${{ vars.HEROKU_MCP_APP }}
          ADMIN_APP: ${{ vars.HEROKU_ADMIN_APP }}
          CHAT_APP: ${{ vars.HEROKU_CHAT_APP }}
        run: |
          set -eu
          askpass="$RUNNER_TEMP/heroku-git-askpass"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *sername*) printf "%s\\n" heroku ;; *) printf "%s\\n" "$HEROKU_API_KEY" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          cd "$RUNNER_TEMP/heroku-source"
          for app in "$AUTH_APP" "$MCP_APP" "$CHAT_APP" "$ADMIN_APP"; do
            test -n "$app"
            heroku stack:set heroku-24 --app "$app"
            git -c credential.helper= push --force "https://git.heroku.com/$app.git" HEAD:refs/heads/main
            heroku ps:scale web=1:eco --app "$app"
          done
          for app in "$AUTH_APP" "$MCP_APP" "$CHAT_APP" "$ADMIN_APP"; do
            web_url="$(heroku info --app "$app" --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["app"]["web_url"])')"
            echo "Checking $app health"
            curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 2 "${web_url%/}/health"
            echo
          done
