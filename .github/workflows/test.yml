name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tcg_dashboard_test
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d tcg_dashboard_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_ROLE_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/tcg_dashboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  test-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/heroku.Dockerfile -t tcg-agent-test .
      - name: Verify the non-root image listens on PORT
        run: |
          set -eu
          docker run -d --name tcg-agent-test -p 127.0.0.1:18999:18999 \
            -e SERVICE_NAME=admin -e PORT=18999 -e DATABASE_URL=sqlite:////tmp/ci.db tcg-agent-test
          trap 'docker logs tcg-agent-test; docker rm -f tcg-agent-test' EXIT
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:18999/health
      - name: Verify the ddg_mcp service enforces its bearer token
        run: |
          set -eu
          docker run -d --name tcg-mcp-test -p 127.0.0.1:18998:18998 \
            -e SERVICE_NAME=ddg_mcp -e PORT=18998 -e MCP_AUTH_TOKEN=ci-token tcg-agent-test
          trap 'docker logs tcg-mcp-test; docker rm -f tcg-mcp-test' EXIT
          health_status="$(curl --silent --output /dev/null --write-out '%{http_code}' --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:18998/health)"
          test "$health_status" = 200
          mcp_status="$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            --data '{"jsonrpc":"2.0","id":1,"method":"ping"}' http://127.0.0.1:18998/mcp)"
          echo "Unauthenticated /mcp status: $mcp_status"
          test "$mcp_status" = 401
