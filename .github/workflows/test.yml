name: Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  test-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/heroku.Dockerfile -t tcg-agent-test .
      - name: Verify the non-root image listens on PORT
        run: |
          set -eu
          docker run -d --name tcg-agent-test -p 127.0.0.1:18999:18999 \
            -e SERVICE_NAME=admin -e PORT=18999 -e DATABASE_URL=sqlite:////tmp/ci.db tcg-agent-test
          trap 'docker logs tcg-agent-test; docker rm -f tcg-agent-test' EXIT
          curl --fail --silent --show-error --retry 15 --retry-all-errors --retry-delay 1 http://127.0.0.1:18999/health
