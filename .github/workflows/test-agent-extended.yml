name: Test extended agent scenarios
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-testing
  cancel-in-progress: false
jobs:
  test-agent:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test-agent-live.yml
    with:
      suite: extended
      model: gpt-6-luna
      max_tokens: 1000000
    secrets:
      GH_ACTIONS_TCG_API_TOKEN: ${{ secrets.GH_ACTIONS_TCG_API_TOKEN }}
