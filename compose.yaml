name: pokemon-tcg-poc
services:
  auth:
    build: { context: ., dockerfile: deploy/backend.Dockerfile }
    command: [uvicorn, services.auth.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log, --no-proxy-headers]
    env_file: .runtime/auth.env
    environment:
      LOCAL_DEV_PASSWORD_ONLY: ${LOCAL_DEV_PASSWORD_ONLY:-false}
    secrets: [jwt_private, jwt_public, totp_key]
    networks: [private, outbound]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  admin-api:
    build: { context: ., dockerfile: deploy/backend.Dockerfile }
    command: [uvicorn, services.admin.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log, --no-proxy-headers]
    env_file: .runtime/admin.env
    networks: [private, outbound]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      auth: {condition: service_healthy}
  ddg-mcp:
    build: { context: ., dockerfile: deploy/backend.Dockerfile }
    command: [uvicorn, services.ddg_mcp.main:app, --host, 0.0.0.0, --port, '8000', --no-access-log, --no-proxy-headers]
    networks: [private, outbound]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
  orchestrator:
    build: { context: ., dockerfile: deploy/backend.Dockerfile }
    env_file: .runtime/orchestrator.env
    environment:
      DDG_MCP_URL: "${DDG_MCP_URL:-http://ddg-mcp:8000/mcp}"
    networks: [private, outbound]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      auth: {condition: service_healthy}
      ddg-mcp: {condition: service_healthy}
  web:
    build: { context: ., dockerfile: deploy/frontend.Dockerfile, target: web }
    networks: [private]
  admin-portal:
    build: { context: ., dockerfile: deploy/frontend.Dockerfile, target: admin-portal }
    networks: [private]
  gateway:
    image: nginxinc/nginx-unprivileged:alpine
    volumes: ['./deploy/gateway.conf:/etc/nginx/conf.d/default.conf:ro']
    ports: ['127.0.0.1:8080:8080']
    networks: [private, outbound]
    depends_on:
      auth: {condition: service_healthy}
      admin-api: {condition: service_healthy}
      orchestrator: {condition: service_healthy}
      web: {condition: service_healthy}
      admin-portal: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, 'http://127.0.0.1:8080/health']
      interval: 15s
      timeout: 3s
      retries: 4
  provision:
    profiles: [setup]
    build: { context: ., dockerfile: deploy/backend.Dockerfile }
    command: [python, -m, scripts.provision]
    volumes: ['./.env:/app/.env:ro', './.runtime:/app/.runtime']
    networks: [outbound]
    healthcheck: {disable: true}
networks:
  private: {internal: true}
  outbound: {}
secrets:
  jwt_private: {file: .runtime/jwt-private.pem}
  jwt_public: {file: .runtime/jwt-public.pem}
  totp_key: {file: .runtime/totp.key}
