server {
    listen 8080;
    server_name localhost;
    client_max_body_size 128k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    # Cloudscape uses inline styles; model content is always rendered as text.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /health { return 200 'ok'; add_header Content-Type text/plain; }
    location /api/auth/ { proxy_pass http://auth:8000/; proxy_set_header Host $host; }
    location /api/admin/ { proxy_pass http://admin-api:8000/; proxy_set_header Host $host; }
    location /api/chat/ {
        proxy_pass http://orchestrator:8000/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        gzip off;
    }
    location = /admin { return 302 /admin/; }
    location /admin/ { proxy_pass http://admin-portal:8080; }
    location / { proxy_pass http://web:8080; }
}
