[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pokemon-tcg-poc"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3",
  "PyJWT[crypto]>=2.10,<3", "argon2-cffi>=23.1", "pyotp>=2.9,<3",
  "cryptography>=44", "python-multipart>=0.0.20", "python-dotenv>=1.0",
  "webauthn>=2.7,<3",
  "langgraph>=1.0,<2", "langchain-openai>=1.0,<2", "langchain-mistralai>=1.0,<2",
  "ddgs>=9,<10", "duckduckgo-mcp-server[browser]>=0.7.0,<1", "Pillow>=11,<13"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2"]

[tool.setuptools.packages.find]
include = ["services*", "shared*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_agent: explicit opt-in tests using live services and paid model calls"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
